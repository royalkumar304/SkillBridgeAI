name: SkillBridge AI CI Pipeline

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    name: Backend Test & Security Regression Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python AI Dependencies
        run: |
          cd ai-service
          pip install -r requirements.txt

      - name: Start AI Microservice in Background
        env:
          INTERNAL_SERVICE_KEY: ci_internal_test_secret_key_32chars_min
          PORT: 8000
        run: |
          cd ai-service
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > ai_service.log 2>&1 &

          # Bounded readiness check for AI microservice (up to 30 seconds)
          ready=0
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:8000/health > /dev/null; then
              echo "AI microservice is healthy on port 8000."
              ready=1
              break
            fi
            sleep 1
          done
          if [ $ready -ne 1 ]; then
            echo "ERROR: AI microservice failed readiness check after 30 seconds."
            cat ai_service.log
            exit 1
          fi

      - name: Install Monorepo & Backend Dependencies
        run: |
          npm ci
          cd backend
          npm ci

      - name: Check Backend Production Audit (0 Vulnerabilities)
        run: |
          npm audit --omit=dev

      - name: Start Express Backend & Run Regression Tests (24 Suites)
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://127.0.0.1:27017/skillbridge_ai_test
          MONGODB_URI: mongodb://127.0.0.1:27017/skillbridge_ai_test
          JWT_SECRET: ci_test_jwt_secret_skillbridge_2026_super_secure_key
          CSRF_SIGNING_SECRET: ci_test_csrf_signing_secret_skillbridge_2026_key
          INTERNAL_SERVICE_KEY: ci_internal_test_secret_key_32chars_min
          AI_SERVICE_URL: http://127.0.0.1:8000
          CLIENT_URL: http://localhost:5173
        run: |
          cd backend
          node server.js > backend_server.log 2>&1 &

          # Bounded readiness check for backend server (up to 30 seconds)
          ready=0
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:5001/api/v1/health > /dev/null; then
              echo "Backend Express API is healthy on port 5001."
              ready=1
              break
            fi
            sleep 1
          done
          if [ $ready -ne 1 ]; then
            echo "ERROR: Backend server failed readiness check after 30 seconds."
            cat backend_server.log
            exit 1
          fi

          # Run the 24 backend test suites against running services
          npm test

  ai-service-tests:
    name: AI Service Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd ai-service
          pip install -r requirements.txt

      - name: Bytecode Syntax Compilation Check
        run: |
          cd ai-service
          python -m compileall app

      - name: Run PyUnit Tests
        env:
          INTERNAL_SERVICE_KEY: ci_internal_test_secret_key_32chars_min
        run: |
          cd ai-service
          python -m unittest discover tests

  frontend-build:
    name: Frontend React Router v7 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm ci

      - name: Check Frontend Production Audit (0 Vulnerabilities)
        run: |
          npm audit --omit=dev

      - name: Build Frontend Distribution
        run: |
          node frontend/tests/navigation_security_test.js
          cd frontend
          npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f frontend/dist/index.html

  docker-build:
    name: Docker Container Image Builds
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, ai-service-tests, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: skillbridge-backend:ci-test

      - name: Build AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
          tags: skillbridge-ai-service:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: skillbridge-frontend:ci-test
